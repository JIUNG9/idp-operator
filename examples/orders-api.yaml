# One manifest = the whole golden path.
# The operator provisions: namespace `orders-api` (team-labeled), an SLO
# baseline ConfigMap (99.9% / 300ms p99 defaults if you write nothing),
# a PodDisruptionBudget, and an ArgoCD Application syncing your overlay.
apiVersion: idp.jiung9.github.io/v1alpha1
kind: ServiceDeployment
metadata:
  name: orders-api
  namespace: idp-system
spec:
  team: checkout
  replicas: 3
  # Criticality, 0 the most critical. Decides how hard a depleted error
  # budget stops automated delivery.
  tier: 1
  # Defaults to prod when unset — an unlabelled service is the one most
  # likely to be mislabelled.
  environment: prod
  slo:
    availabilityTarget: "99.95"
    latencyP99Ms: 250
  gitops:
    repoURL: https://github.com/acme-corp/orders-api-deploy
    path: overlays/prod
