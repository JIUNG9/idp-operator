# Leader election writes a coordination.k8s.io Lease in the operator's own
# namespace and records events on it. Kept apart from role.yaml because that
# file is generated by controller-gen from the kubebuilder markers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idp-operator-leader-election
  namespace: idp-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idp-operator-leader-election
  namespace: idp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idp-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: idp-operator
    namespace: idp-system
