apiVersion: v1
kind: Namespace
metadata:
  name: idp-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-operator
  namespace: idp-system
  labels:
    app.kubernetes.io/name: idp-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idp-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idp-operator
    spec:
      serviceAccountName: idp-operator
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          # Image publishing is wired in M4 (CI); until then build locally.
          image: ghcr.io/jiung9/idp-operator:dev
          # Every ServiceDeployment is rejected unless its spec.gitops.project is listed.
          # "default" matches the quickstart; replace it with the AppProjects your teams
          # may use, and do not list a project that can deploy to other teams' namespaces.
          args:
            - -allowed-projects=default
            # Only one replica reconciles at a time; the others wait on the Lease.
            - -leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # Memory limit only, on purpose: a memory-leaking operator should
            # be killed; a CPU limit would just throttle reconciles.
            limits:
              memory: 128Mi
