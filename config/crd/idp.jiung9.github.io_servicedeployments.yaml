---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: servicedeployments.idp.jiung9.github.io
spec:
  group: idp.jiung9.github.io
  names:
    kind: ServiceDeployment
    listKind: ServiceDeploymentList
    plural: servicedeployments
    shortNames:
    - svcdep
    singular: servicedeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.team
      name: Team
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.slo.availabilityTarget
      name: SLO
      type: string
    - jsonPath: .status.budget.verdict
      name: Budget
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ServiceDeployment is one service on the golden path.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServiceDeploymentSpec is the single manifest a team writes to get a
              namespace, GitOps delivery, and an SLO baseline.
            properties:
              environment:
                default: prod
                description: |-
                  Environment decides whether a depleted budget merely warns or stops
                  unattended delivery. Defaults to prod: an unlabelled service is the
                  one most likely to be mislabelled.
                enum:
                - prod
                - staging
                - dev
                type: string
              gitops:
                description: GitOps points at the manifests ArgoCD should deliver
                  for this service.
                properties:
                  path:
                    minLength: 1
                    type: string
                  project:
                    default: default
                    type: string
                  repoURL:
                    minLength: 1
                    type: string
                  targetRevision:
                    default: HEAD
                    type: string
                required:
                - path
                - repoURL
                type: object
              replicas:
                default: 1
                description: |-
                  Replicas the workload declares; drives the PDB baseline. 0 means
                  scaled to zero — the golden path provisions no PDB and says so in
                  a status condition instead of shipping a drain-blocking fake one.

                  A pointer, because 0 is a meaningful value here: with a plain int and
                  `omitempty`, a client setting 0 would serialise nothing, the API
                  server would apply the default of 1, and the request would be
                  silently inverted.
                format: int32
                minimum: 0
                type: integer
              slo:
                default: {}
                description: |-
                  SLO is the reliability contract every service on the golden path gets.
                  Empty fields are defaulted by the CRD schema (99.9% / 300ms); the controller
                  re-applies the same defaults as defense-in-depth so a team that writes
                  nothing still ends up with a measurable target.
                properties:
                  availabilityTarget:
                    default: "99.9"
                    description: AvailabilityTarget is a percentage string, e.g. "99.9".
                    pattern: ^\d{1,2}(\.\d+)?$
                    type: string
                  latencyP99Ms:
                    default: 300
                    description: LatencyP99Ms is the p99 latency target in milliseconds.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              team:
                description: Team owns the service; stamped on every provisioned object.
                minLength: 1
                type: string
              tier:
                default: 2
                description: |-
                  Tier is service criticality, 0 the most critical, matching
                  error-budget-gate's tiers. It changes how hard a depleted error budget
                  stops delivery. Pointer for the same reason as Replicas — and here it
                  matters more, since tier 0 is the value you least want silently
                  rewritten to the default.
                format: int32
                maximum: 3
                minimum: 0
                type: integer
            required:
            - gitops
            - team
            type: object
          status:
            description: |-
              ServiceDeploymentStatus reports what the golden path did. Phase says
              whether the objects exist and match spec — Provisioned does NOT claim the
              application is healthy; delivery health is ArgoCD's job.
            properties:
              budget:
                description: |-
                  BudgetStatus is the delivery gate's memory. It is persisted rather than
                  recomputed from scratch because the anti-flapping rule needs to know what
                  the last verdict was, and because a verdict that resets every time the
                  operator restarts is not a gate.
                properties:
                  environment:
                    description: |-
                      Environment and Tier record what the gate believed about the service
                      when it decided. Both are self-service spec fields that weaken the
                      verdict, so the decision carries them: a service relabelled to dev to
                      win back automated delivery says so in its own status.
                    type: string
                  lastEvaluationTime:
                    description: LastEvaluationTime is when the reading was taken.
                    format: date-time
                    type: string
                  remainingPercent:
                    description: RemainingPercent is the error budget left at the
                      last reading.
                    format: int32
                    type: integer
                  source:
                    description: Source names where the reading came from.
                    type: string
                  streak:
                    description: |-
                      Streak counts consecutive readings arguing for a looser verdict than
                      the one in force. Loosening waits; tightening never does.
                    format: int32
                    type: integer
                  tier:
                    format: int32
                    type: integer
                  verdict:
                    description: Verdict is allow, require-human, or block.
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is one of Provisioned, Invalid, Error, Deleting.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
