# Test fixture ONLY — a minimal stand-in for the Kyverno namespaced Policy
# CRD so envtest can accept Policy objects and the RESTMapper can resolve the
# kind. The real CRD ships with Kyverno and is far larger; like it, spec here
# is schemaless (preserve-unknown-fields).
#
# envtest runs an API server with no controllers and no webhooks, so a Policy
# accepted here is never *enforced* here. That the baseline actually rejects a
# privileged or unsigned pod is proven by the kind-based e2e in M4.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policies.kyverno.io
spec:
  group: kyverno.io
  names:
    kind: Policy
    listKind: PolicyList
    plural: policies
    singular: policy
    shortNames: [pol]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
